<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexivel</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela a melho experiência &#x</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/me-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/me-m.png" type="image/png">
        <img src="imagens/me-g.png" alt="Minha imagen no site">
    </picture>
</body>
</html>
