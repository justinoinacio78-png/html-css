<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=vpn_key" />
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>
    <main>
            <section>
                <div id="foto">
                    <p>FOTO</p>
                </div>
                <div id="login">
                    <h1>Login</h1>
                    <p id="conteudo">Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente</p>
                    <form action="login.php" method="post">
                        <p class="campo">
                            <label for="inome"><img src="imagem/account.svg" alt=""></label>
                            <input type="text" name="nome" id="inome" class="entrada" placeholder="Digite seu nome">
                        </p>
                        <p class="campo">
                            <label for="isenha"><img src="imagem/key.svg" alt=""></label>
                            <input type="password" name="senha" id="isenha" class="entrada" placeholder="Digite sua senha">
                        </p>
                        <p class="ultimop">
                            <input type="submit" value="Entrar" class="click">
                            <input type="reset" value="Esqueci a senha" class="click">
                        </p>
                    </form>
                </div>
            </section>
    </main>
</body>
</html>
