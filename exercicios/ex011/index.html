<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>
<body>
    <h1>Imagem dinámica</h1>
    <p>Tenta abrir este site de varios dispositivos diferentes ou simplesmente aumenta e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos reproduzir áudio em HTML</p>
   <!-- <audio src="midias/happy-mistake.mp3" controls autoplay></audio>-->
   <audio preload="auto" controls autoplay loop>
        <source src="midias/guanacast-33.mp3" type="audio/mpeg">
   </audio>
</body>
</html>
