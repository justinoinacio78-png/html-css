<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            background-color: cornflowerblue;
            height: 200px;
            width: 400px;
            border: 10px;
            border-color: black;
            border-style: solid;
            padding: 50px 10px 5px 15px;
            margin: 50px auto;
        }

        a{
            text-decoration: none;
            border: 12px;
            border-style: solid;
            border-color: burlywood;
            padding: 10px;
            margin: 30px 1px 20px 5px;
        }

        a:visited{
            color: blue;
        }

    </style>
</head>
<body>
    <h1>Exemplo de modelos de caixas</h1>
    <p>As caixas são elementos muito importantes e elas <a href="#">Link qualquer</a> estão divididas em box-leve e inine-level</p>
</body>
</html>
