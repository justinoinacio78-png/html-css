<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
    <style>
        table{
            width: 600px;
            border-collapse: collapse;
        }

        caption{
            font-size: 1.5em;
            font-weight: bold;
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        .nome{
            background-color: lightcoral;
        }
        .grupo{
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <table>
        <caption>Cadastro</caption>
        <colgroup>
            <col class="nome">
            <col class="idade">
            <col class="grupo" span="2">
        </colgroup>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Idade</th>
                <th scope="col">Sexo</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>João da Silva</td>
                <td>25</td>
                <td>Masculino</td>
                <td>Engenheiro</td>
            </tr>
            <tr>
                <td>Maria Oliveira</td>
                <td>30</td>
                <td>Feminino</td>
                <td>Médica</td>
            </tr>
            <tr>
                <td>Carlos Souza</td>
                <td>28</td>
                <td>Masculino</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Ana Paula Santos</td>
                <td>22</td>
                <td>Feminino</td>
                <td>Designer</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
