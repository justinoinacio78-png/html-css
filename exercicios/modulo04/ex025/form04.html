<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplos de Formulários</h1>
    <fieldset>
        <legend>Contactos</legend>
        <form action="cadastro.js" method="post" autocomplete="on">
            <p><label for="inome">Nome</label>
                <input type="text" name="nome" id="inome"
                placeholder="Digite seu nome">
            </p>
            <p><label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" required
            placeholder="Digite seu nº de telefone" autocomplete="tel">
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" placeholder="Digite seu email" autocomplete="email">
            </p>
            </fieldset>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
</body>
</html>
