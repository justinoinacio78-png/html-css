<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <form action="cadastro.fs">
            <p>
                <fieldset>
                    <legend>Sexo</legend>
                    <input type="radio" name="sexo" id="isema">
                    <label for="isema">Masculino</label> <br>
                    <input type="radio" name="sexo" id="isefe">
                    <label for="isefe">Feminino</label>
            </fieldset>
            </p>
        <fieldset>
            <legend>Desporto Favorito</legend>
            <input type="checkbox" name="fut" id="ifut">
            <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="bas" id="ibas">
            <label for="ibas">Basquetebol</label> <br>
            <input type="checkbox" name="nat" id="inat">
            <label for="inat">Natação</label> <br>
            <input type="checkbox" name="ten" id="iten">
            <label for="iten">Ténis</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
