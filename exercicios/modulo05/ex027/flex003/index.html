<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
        }

        div.item{
            background-color: lightblue;
            text-align: center;
            border: 1px solid black;
           
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exmplo de bloco A</div>
        <div class="item">Exmplo de bloco B</div>
        <div class="item">Exmplo de bloco C</div>
        <div class="item">Exmplo de bloco D</div>
        <div class="item">Exmplo de bloco E</div>
        <div class="item">Exmplo de bloco F</div>
        <div class="item">Exmplo de bloco G</div>
        <div class="item">Exmplo de bloco H</div>
    </div>
</body>
</html>
