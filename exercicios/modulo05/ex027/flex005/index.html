<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização de Flexbox</title>
    <style>

        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body{
            background-color: lightsalmon;
        }

        main{
            background-color: rgb(25, 163, 209);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        section{
            background-color: rgb(17, 228, 17);
            height: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Centralização de Flexbox</h1>
        </section>
    </main>
</body>
</html>
