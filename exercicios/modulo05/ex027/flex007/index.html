<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flebolx</title>
     <style>
        *{
            padding: 0px;
            margin: 0px;
        }

        body{
            background-color: lightgreen;
        }

        div.conteiner{
            height: 300px;
            background-color: lightsalmon;
            display: flex;
        }

        div.item{
            background-color: lightblue;
            text-align: center;
            border: 1px solid black;
            padding: 20px;
        }

        #i1{
            order: 0;
        }
        #i2{
            order: 1;
        }
        #i3{
            order: -3;
        }
        #i4{
            order: 2;
        }
        #i5{
            order: 1;
        }
        #i6{
            order: 0;
        }
        #i7{
            order: -8;
        }
    
        #i8{
            order: 6;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
        <div class="item" id="i8">H</div>
    </div>
</body>
</html>
