<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
        }

        div.item{
            background-color: lightblue;
            text-align: center;
            border: 1px solid black;
            flex-basis: 400px;

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">Cccccc ccccccccccccc ccccc</div>
        <div class="item">Dddd dd dddd</div>
        <div class="item">E</div>
        <div class="item">Ffff ffffffffffffff fffff fffffff fffffffffffffffff fff   ffffff ffffffffff ffffffff</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
